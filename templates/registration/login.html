<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5" style="max-width: 500px;">
    <h2 class="mb-4">Tesco Payroll Login</h2>

    {% if form.errors %}
        <div class="alert alert-danger">Your username or password was incorrect.</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Username</label>
            {{ form.username }}
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            {{ form.password }}
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <div class="mt-3">
        <p><strong>Demo users</strong></p>
        <p>admin / password</p>
        <p>hr1 / password</p>
        <p>payroll1 / password</p>
        <p>manager1 / password</p>
        <p>user1 / password</p>
    </div>
</div>
</body>
</html>
